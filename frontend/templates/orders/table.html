<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Order</th>
        <th>Pharmacy</th>
        <th>Status</th>
        <th>Total</th>
        <th></th>
      </tr>
    </thead>

    <tbody>
      {% for order in orders %}
        <tr>
          <td>#{{ order.pk }}</td>
          <td>{{ order.pharmacy.name }}</td>
          <td>
            <span class="badge badge-{{ order.status }}">
              {{ order.get_status_display }}
            </span>
          </td>
          <td>MUR {{ order.total|floatformat:2 }}</td>
          <td>
            <a href="{% url 'order_detail' order.pk %}">View</a>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="5" class="empty">No completed deliveries yet.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
