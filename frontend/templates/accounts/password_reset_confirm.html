{% extends "base.html" %}
{% block content %}
  <main class="container narrow section">
    <div class="card">
      <h1>Set your password</h1>
      {% if validlink %}
        <form method="post" class="form-stack">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="button">Save Password</button>
        </form>
      {% else %}
        <p>This link has expired or is invalid.</p>
        <a href="{% url 'password_reset' %}">Request another link</a>
      {% endif %}
    </div>
  </main>
{% endblock %}
