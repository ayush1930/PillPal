{% extends "base.html" %}
{% block content %}
  <main class="container narrow section">
    {% include "partials/logo.html" %}
    <div class="card">
      <h1>Reset your password</h1>
      <p class="muted">Enter your email to receive a reset link.</p>
      <form method="post" class="form-stack">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button">Send Reset Link</button>
      </form>
      <p><a href="{% url 'auth' %}">Back to sign in</a></p>
    </div>
  </main>
{% endblock %}
